<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Violência em Jaboatão: o que dizem os números</title>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000;
    font-family: 'Inter Display', 'Inter', sans-serif; }
  canvas { display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .stroke { paint-order: stroke fill; -webkit-text-stroke: 16px #1d1b2e; }
  #title { position: absolute; top: 250px; width: 100%; text-align: center; }
  #title .a { font-weight: 900; font-size: 110px; color: #fff; display: block; line-height: 1.05; }
  #title .b { font-weight: 900; font-size: 84px; color: #ffd60a; display: block; margin-top: 18px; }
  #sub { position: absolute; left: 60px; right: 60px; bottom: 230px; background: #fff;
    border: 8px solid #1d1b2e; border-radius: 44px; padding: 52px 44px 40px;
    box-shadow: 0 14px 0 rgba(29, 27, 46, .35); transform-origin: 50% 100%; }
  #who { position: absolute; top: -46px; left: 40px; padding: 8px 30px; border-radius: 30px;
    font-weight: 900; font-size: 46px; color: #fff; border: 7px solid #1d1b2e; }
  #txt { font-weight: 800; font-size: 52px; line-height: 1.28; color: #1d1b2e; }
  #txt .n { color: #e8590c; }
  #txt .g { color: #1f9d55; }
  #fonte { position: absolute; left: 60px; right: 60px; top: 200px; padding: 16px 26px; border-radius: 22px;
    background: rgba(10, 14, 40, .72); color: #dfe7ff; font-weight: 700; font-size: 30px; line-height: 1.3;
    opacity: 0; }
  #fonte b { color: #fff; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; opacity: 0; background: rgba(10, 12, 40, .7); }
  #card .c1 { font-weight: 900; font-size: 100px; color: #ffd60a; }
  #card .c2 { font-weight: 900; font-size: 70px; color: #fff; text-align: center; line-height: 1.1; margin-top: 20px; }
  #card .c3 { margin-top: 50px; max-width: 900px; font-weight: 700; font-size: 34px; color: #dfe7ff;
    text-align: center; line-height: 1.35; }
  #card .who { margin-top: 60px; display: flex; align-items: center; gap: 22px; font-weight: 900;
    font-size: 52px; color: #fff; }
  #card .who img { width: 120px; height: 120px; border-radius: 50%; border: 6px solid #fff; }
  #card .btn { margin-top: 60px; background: #0095f6; color: #fff; font-weight: 900; font-size: 64px;
    padding: 24px 66px; border-radius: 26px; border: 8px solid #1d1b2e; }
  #prog { position: absolute; left: 60px; right: 60px; top: 70px; height: 14px; border-radius: 7px;
    background: rgba(255, 255, 255, .35); overflow: hidden; }
  #prog div { height: 100%; background: #fff; width: 0; }
  #handle { position: absolute; top: 106px; left: 60px; display: flex; align-items: center; gap: 14px;
    font-weight: 800; font-size: 38px; color: #fff; text-shadow: 0 3px 8px rgba(0, 0, 0, .45); }
  #hook { position: absolute; top: 300px; width: 100%; text-align: center; }
  #num { font-weight: 900; font-size: 300px; line-height: 1; color: #ffd60a; display: inline-block;
    paint-order: stroke fill; -webkit-text-stroke: 22px #1d1b2e; }
  #numcap { margin-top: 6px; font-weight: 900; font-size: 64px; color: #fff; }
  #q { margin-top: 70px; display: flex; justify-content: center; align-items: center; gap: 18px;
    font-weight: 900; font-size: 64px; color: #fff; white-space: nowrap; }
  #q span { padding: 10px 24px; border-radius: 24px; border: 7px solid #1d1b2e; }
  #upq { background: #e63946; }
  #dnq { background: #1f9d55; }
  #q .or { border: none; padding: 0; }
  #vig { position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(circle at 50% 40%, transparent 35%, rgba(214, 40, 57, .65) 100%); }
  #handle img { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ov">
  <div id="title"><span class="a stroke">VIOLÊNCIA EM<br>JABOATÃO</span><span class="b stroke">o que dizem os números</span></div>
  <div id="vig"></div>
  <div id="hook"><div id="num" class="stroke">0</div><div id="numcap" class="stroke">assassinatos em um ano</div>
    <div id="q"><span id="upq">▲ SUBINDO</span><span class="or stroke">ou</span><span id="dnq">CAINDO ▼</span></div></div>
  <div id="fonte"></div>
  <div id="sub"><div id="who"></div><div id="txt"></div></div>
  <div id="card"><div class="c1 stroke">Fique informado</div>
    <div class="c2 stroke">Siga para mais<br>vídeos com o Faísca</div>
    <div class="c3">Fontes: Secretaria de Defesa Social de Pernambuco (boletim de 24/01/2026)
      e Blog do Magno, citando dados da SDS-PE.</div>
    <div class="who"><img src="perfil.png">@faisca.curioso</div>
    <div class="btn">+ SEGUIR</div></div>
  <div id="handle"><img src="perfil.png">@faisca.curioso</div>
  <div id="flash"></div>
  <div id="prog"><div></div></div>
</div>
<script type="module">
import * as THREE from 'three';
import { clamp, lerp, smooth, easeOut, easeBack, rng, M, mesh, box, sph, cap, cyl, glow, canvasTex,
  label, makeFaisca, makeOverlay } from './comum.js';

const TL = await (await fetch('build/jaboatao/timeline.json')).json();
const W = 1080, H = 1920;
const S = Object.fromEntries(TL.shots.map(s => [s.name, s]));
const L = TL.lines;
const rand = rng(81);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = canvasTex(512, 1024, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#0d1338'); gr.addColorStop(0.55, '#24305f'); gr.addColorStop(1, '#3a3a6e');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    g.fillStyle = `rgba(160,180,255,${0.04 + rand() * 0.06})`;
    g.beginPath(); g.arc(rand() * w, rand() * h * 0.7, 10 + rand() * 50, 0, 7); g.fill();
  }
});
const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 200);

scene.add(new THREE.HemisphereLight('#c9d6ff', '#3a3550', 1.1));
const key = new THREE.DirectionalLight('#fff1dc', 2.2); key.position.set(3, 8, 5);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 4; key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
scene.add(key);
const rim = new THREE.DirectionalLight('#8fb0ff', 1.2); rim.position.set(-4, 3, -4); scene.add(rim);

// ------------------------------------------------------------ estúdio e maquete
mesh(new THREE.CircleGeometry(30, 64), M('#2a2d55', { roughness: 0.9 }), [0, -0.6, 0], scene, false).rotation.x = -Math.PI / 2;
const city = new THREE.Group(); scene.add(city);
const R = 2.6, TOP = 0.0;
mesh(cyl(R + 0.1, R + 0.18, 0.6, 96), M('#f3ead8', { roughness: 0.7 }), [0, -0.3, 0], city);
mesh(new THREE.TorusGeometry(R + 0.12, 0.04, 8, 96), M('#c9a26b'), [0, 0, 0], city).rotation.x = Math.PI / 2;
// terra, praia e mar (o mar fica a leste, à direita)
mesh(new THREE.CircleGeometry(R, 96), M('#8fcf7a', { roughness: 1 }), [0, TOP + 0.004, 0], city, false).rotation.x = -Math.PI / 2;
const SEA_X = 1.75, seaA = Math.acos(SEA_X / R);
const seaShape = new THREE.Shape();
seaShape.moveTo(SEA_X, -Math.sin(seaA) * R);
seaShape.absarc(0, 0, R, -seaA, seaA, false);
seaShape.lineTo(SEA_X, -Math.sin(seaA) * R);
const seaM = new THREE.MeshStandardMaterial({ color: '#3fa7e0', roughness: 0.25, metalness: 0.1 });
const sea = mesh(new THREE.ShapeGeometry(seaShape, 48), seaM, [0, TOP + 0.02, 0], city, false);
sea.rotation.x = -Math.PI / 2;
const sand = mesh(box(0.22, 0.02, 2 * Math.sin(seaA) * R), M('#f2dca0', { roughness: 1 }), [SEA_X - 0.11, TOP + 0.012, 0], city, false);
// ruas
const roadM = M('#55576b', { roughness: 0.9 });
for (const z of [-1.2, -0.2, 0.8]) mesh(box(3.0, 0.012, 0.13), roadM, [-0.2, TOP + 0.012, z], city, false);
for (const x of [-1.3, -0.2, 0.9]) mesh(box(0.13, 0.013, 3.6), roadM, [x, TOP + 0.013, 0], city, false);
// prédios (mais altos perto da orla, como em Piedade)
const winTex = canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#8fb6e8';
  for (let y = 8; y < h - 4; y += 14) for (let x = 6; x < w - 4; x += 16) g.fillRect(x, y, 9, 8);
});
winTex.wrapS = winTex.wrapT = THREE.RepeatWrapping;
const pastel = ['#f7d6a0', '#f4a6a6', '#a6d8f4', '#c7b8f2', '#f2f2f2', '#b8e0c2', '#ffd6e0'];
const buildings = [];
for (let i = 0; i < 80; i++) {
  const x = -2.3 + rand() * 3.6, z = -2.2 + rand() * 4.4;
  if (Math.hypot(x, z) > R - 0.3 || x > 1.4) continue;
  if (Math.abs(x + 0.2) < 0.15 || [-1.3, -0.2, 0.9].some(v => Math.abs(x - v) < 0.14)) continue;
  if ([-1.2, -0.2, 0.8].some(v => Math.abs(z - v) < 0.14)) continue;
  if (Math.hypot(x + 1.3, z + 1.5) < 0.75) continue; // monte
  const nearBeach = clamp((x + 0.5) / 1.8);
  const h = 0.12 + rand() * 0.25 + nearBeach * nearBeach * (0.4 + rand() * 0.7);
  const w = 0.14 + rand() * 0.12, d = 0.14 + rand() * 0.12;
  const tex = winTex.clone(); tex.repeat.set(1, Math.max(1, Math.round(h * 5))); tex.needsUpdate = true;
  const b = mesh(box(w, h, d), M(pastel[i % pastel.length], { map: tex, roughness: 0.7 }), [x, TOP + h / 2, z], city);
  buildings.push({ b, h, d0: rand() });
}
// árvores
for (let i = 0; i < 40; i++) {
  const x = -2.3 + rand() * 3.5, z = -2.2 + rand() * 4.4;
  if (Math.hypot(x, z) > R - 0.2) continue;
  mesh(new THREE.IcosahedronGeometry(0.06 + rand() * 0.05, 0), M(i % 2 ? '#3f9a50' : '#56b866', { flatShading: true }), [x, TOP + 0.08, z], city);
}
// Monte dos Guararapes com a igreja de N. Sra. dos Prazeres
const hill = mesh(sph(0.75, 32, 16), M('#6fb35e', { roughness: 1 }), [-1.3, TOP - 0.2, -1.5], city); hill.scale.y = 0.75;
const church = new THREE.Group(); church.position.set(-1.3, TOP + 0.36, -1.5); city.add(church);
const white = M('#ffffff', { roughness: 0.6 });
mesh(box(0.34, 0.2, 0.22), white, [0, 0.1, 0], church);
for (const sx of [-1, 1]) {
  mesh(box(0.08, 0.32, 0.08), white, [sx * 0.15, 0.16, 0.08], church);
  mesh(new THREE.ConeGeometry(0.06, 0.1, 4), M('#d9734e'), [sx * 0.15, 0.37, 0.08], church).rotation.y = Math.PI / 4;
}
mesh(box(0.36, 0.04, 0.24), M('#d9734e'), [0, 0.22, 0], church);
// palmeiras na orla
for (let i = 0; i < 6; i++) {
  const z = -0.95 + i * 0.38, p = new THREE.Group(); p.position.set(1.5, TOP, z); city.add(p);
  mesh(cyl(0.012, 0.016, 0.3, 6), M('#8a5a3c'), [0, 0.15, 0], p);
  for (let k = 0; k < 5; k++) {
    const leaf = mesh(box(0.16, 0.01, 0.04), M('#3f9a50'), [Math.cos(k * 1.26) * 0.06, 0.3, Math.sin(k * 1.26) * 0.06], p, false);
    leaf.rotation.set(0, -k * 1.26, -0.4);
  }
}

// ------------------------------------------------------------ Faísca
const fa = makeFaisca(); scene.add(fa.root);
const FA = new THREE.Vector3(1.05, 0.95, 0.9);

// ------------------------------------------------------------ hologramas
const holo = new THREE.Group(); holo.position.set(-0.3, 0.05, 0.2); scene.add(holo);
// 1) alta até 2023: seta subindo + número
const up = new THREE.Group(); holo.add(up);
const upM = glow('#ff7a45', 0.85);
const upShaft = mesh(cyl(0.07, 0.07, 1, 16), upM, [0, 0, 0], up, false);
const upHead = mesh(new THREE.ConeGeometry(0.2, 0.34, 24), upM, [0, 0, 0], up, false);
up.rotation.z = -0.5; up.position.set(-0.2, 1.0, 0);
const lbl323 = label('323 vítimas', { color: '#ffffff', bg: '#e8590c', size: 0.36 }); lbl323.position.set(0.15, 2.45, 0.2); holo.add(lbl323);
const lblPico = label('2023: pico', { color: '#1d1b2e', bg: '#ffd166', size: 0.26 }); lblPico.position.set(0.15, 2.05, 0.2); holo.add(lblPico);
const lblCres = label('desde 2022: alta', { color: '#ffffff', bg: 'rgba(29,27,46,.8)', size: 0.22 }); lblCres.position.set(0.1, 0.8, 0.3); holo.add(lblCres);
// 2) gráfico de barras: AIS-6 (Jaboatão + Moreno), Mortes Violentas Intencionais
const DATA = [['2004', 622, '#8f9bb3'], ['2024', 332, '#ff8c42'], ['2025', 277, '#2ecc71']];
const MAXH = 2.1;
const bars = DATA.map(([ano, v, c], i) => {
  const g = new THREE.Group(); g.position.set(-1.0 + i * 0.68, 0.0, 0); holo.add(g);
  const mat = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.45, transparent: true, opacity: 0.88, roughness: 0.3 });
  const bar = mesh(box(0.5, 1, 0.5), mat, [0, 0.5, 0], g, false);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(box(0.5, 1, 0.5)), new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.8 }));
  edge.position.y = 0.5; g.add(edge);
  const yl = label(ano, { color: '#ffffff', bg: 'rgba(29,27,46,.85)', size: 0.22 }); yl.position.set(0, -0.18, 0.3); g.add(yl);
  const vl = label(String(v), { color: '#1d1b2e', bg: '#ffffff', size: 0.26 }); g.add(vl);
  return { g, bar, edge, vl, h: v / 622 * MAXH };
});
const badge = label('-16,6%', { color: '#ffffff', bg: '#1f9d55', size: 0.34 }); badge.position.set(0.36, 1.95, 0.4); holo.add(badge);
const lowest = label('menor desde 2004', { color: '#1d1b2e', bg: '#b8f2c9', size: 0.24 }); lowest.position.set(0.36, 1.55, 0.4); holo.add(lowest);
// 3) luzes subindo da cidade (cada número é uma vida)
const lights = [];
for (let i = 0; i < 60; i++) {
  const m = mesh(sph(0.03, 10, 8), new THREE.MeshBasicMaterial({ color: '#ffe8b0' }), [0, 0, 0], scene, false);
  const h = mesh(sph(0.09, 10, 8), glow('#ffcf7a', 0.3), [0, 0, 0], scene, false);
  const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * (R - 0.4);
  lights.push({ m, h, x: Math.cos(a) * r - 0.3, z: Math.sin(a) * r, d: rand() * 3.5, sp: 0.25 + rand() * 0.25, ph: rand() * 6 });
}
// 4) 190
const lbl190 = label('Emergência: 190', { color: '#ffffff', bg: '#d62839', size: 0.34 });
lbl190.position.set(0.3, 2.2, 0.6); scene.add(lbl190);

// ------------------------------------------------------------ câmera
const CAM = {
  apresentacao: [[0.5, 2.0, 5.4], [0.4, 0.6, 0.5], [0.6, 1.9, 4.8], [0.5, 0.65, 0.6]],
  alta: [[0.0, 2.0, 6.6], [-0.1, 0.8, 0.2], [0.1, 2.0, 6.0], [-0.1, 0.85, 0.2]],
  grafico: [[-0.35, 1.9, 6.8], [-0.35, 0.6, 0.2], [-0.25, 1.85, 6.2], [-0.3, 0.65, 0.2]],
  ainda: [[-4.2, 4.0, 5.2], [0, 0.0, 0], [4.0, 3.8, 5.4], [0, 0.1, 0]],
  final: [[0.3, 2.0, 5.6], [0.3, 1.0, 0.6], [0.4, 1.95, 5.0], [0.3, 1.05, 0.6]],
  cartao: [[0.4, 1.95, 5.0], [0.3, 1.05, 0.6], [0.4, 3.0, 6.8], [0, 0.3, 0]],
};
function setCamera(shot, t) {
  const k = smooth((t - shot.start) / (shot.end - shot.start));
  let p, q;
  if (shot.name === 'externa') {
    p = [2.7, 0.75, 2.3]; q = [-1.0, 0.3, -1.0];
  } else if (shot.name === 'gancho') {
    // três cortes rápidos: rente aos prédios, de cima girando, plano aberto
    const lt = t - shot.start;
    if (lt < 2.8) {
      const e = easeOut(lt / 2.8);
      p = [lerp(2.7, 1.7, e), lerp(0.75, 0.9, e), lerp(2.3, 1.1, e)];
      q = [lerp(-1.0, -1.3, e), lerp(0.3, 0.35, e), lerp(-1.0, -1.4, e)];
    } else if (lt < 5.6) {
      const a = (lt - 2.8) * 0.55;
      p = [Math.sin(a) * 1.2, lerp(5.6, 4.8, (lt - 2.8) / 2.8), Math.cos(a) * 1.2]; q = [0, 0, 0];
    } else {
      const e = easeOut((lt - 5.6) / Math.max(0.5, shot.end - shot.start - 5.6));
      p = [lerp(0, 0.3, e), lerp(2.8, 2.2, e), lerp(7.6, 6.2, e)]; q = [0, 0.4, 0];
    }
  } else {
    const c = CAM[shot.name];
    p = c[0].map((v, i) => lerp(v, c[2][i], k));
    q = c[1].map((v, i) => lerp(v, c[3][i], k));
  }
  p[0] += Math.sin(t * 0.7) * 0.02; p[1] += Math.sin(t * 1.1 + 1) * 0.012;
  camera.position.set(...p); camera.lookAt(...q);
}

const overlay = makeOverlay(TL, {
  names: { faisca: 'Faísca' }, colors: { faisca: '#e07a52' },
  keyClass: (w, ln) => /^(323|2023)/.test(w) ? 'n' : /^(277|2025|menos|virada)/.test(w) && ln.shot === 'grafico' ? 'g' : '',
});
const FONTES = [
  [S.alta, '<b>Fonte:</b> Secretaria de Defesa Social de Pernambuco (SDS-PE), citada pelo Blog do Magno. Vítimas de crimes violentos letais intencionais em Jaboatão.'],
  [S.grafico, '<b>Fonte:</b> SDS-PE, boletim de 24/01/2026. Mortes violentas intencionais na área AIS-6 (Jaboatão + Moreno).'],
];
function fonte(t) {
  const el = document.getElementById('fonte');
  const f = FONTES.find(([s]) => t >= s.start && t < s.end);
  if (!f) { el.style.opacity = 0; return; }
  el.innerHTML = f[1];
  el.style.opacity = smooth((t - f[0].start - 0.3) / 0.4) * (1 - smooth((t - f[0].end + 0.3) / 0.3));
}

// ------------------------------------------------------------ animação
const speaking = t => TL.mouth.faisca[Math.min(TL.mouth.faisca.length - 1, Math.max(0, Math.round(t * TL.fps)))];
const blink = t => ((t + 1.9) % 3.3) < 0.13 ? 0.15 : 1;

function animate(t) {
  const shot = TL.shots.find(s => t >= s.start && t < s.end) || TL.shots[TL.shots.length - 1];
  setCamera(shot, t);
  city.rotation.y = 0;
  sea.position.y = TOP + 0.02 + Math.sin(t * 1.5) * 0.004;
  // prédios surgem no começo
  buildings.forEach(({ b, h, d0 }) => {
    const k = easeBack((t - 0.1 - d0 * 1.2) / 0.45);
    b.scale.y = Math.max(0.001, k); b.position.y = TOP + h * Math.max(0.001, k) / 2;
  });

  // Faísca: aparece no início da apresentação; tom sério no meio
  const talk = speaking(t);
  const appear = t - (S.apresentacao.start + 0.3);
  const toHolo = smooth((t - S.alta.start) / 0.6) * (1 - smooth((t - S.ainda.start) / 0.6));
  fa.root.visible = appear > 0;
  fa.root.scale.setScalar(0.85 * Math.max(0.001, easeBack(appear / 0.5, 2.2)));
  fa.root.position.set(FA.x + toHolo * 0.15, FA.y + Math.sin(t * 2.2) * 0.04 - toHolo * 0.2, FA.z);
  fa.root.rotation.y = lerp(-0.25, -0.75, toHolo) + (1 - easeOut(appear / 0.7)) * Math.PI * 2;
  const serious = smooth((t - S.ainda.start) / 0.5) * (1 - smooth((t - S.final.start - 0.5) / 0.6));
  const sq = 1 + talk * 0.04 * Math.sin(t * 14);
  fa.body.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
  fa.body.rotation.z = Math.sin(t * 1.6) * 0.03 + talk * Math.sin(t * 4) * 0.04;
  fa.body.rotation.x = -talk * 0.04 + serious * 0.18;
  fa.mouth.scale.set(1.25 - talk * 0.25, 0.2 + talk * 1.0, 0.45);
  fa.eyes.forEach(e => { e.scale.y = blink(t) * (1 - serious * 0.25); });
  fa.star.rotation.y = t * 1.5; fa.star.material.emissiveIntensity = 1.1 + Math.sin(t * 4) * 0.25 - serious * 0.5;
  fa.legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 2.5 + i * 2) * 0.2; });
  let aL = 0.25 + Math.sin(t * 2.2) * 0.06, aR = 0.25 + Math.sin(t * 2.2 + 1) * 0.06;
  if (talk > 0.05) { aL += Math.sin(t * 4.5) * 0.25 * talk + 0.2; aR += Math.sin(t * 4.5 + 2) * 0.2 * talk; }
  aL = lerp(aL, 1.9 + Math.sin(t * 2) * 0.08, toHolo);
  aL = lerp(aL, 0.15, serious); aR = lerp(aR, 0.15, serious);
  const hello = smooth((appear - 0.5) / 0.3) * (1 - smooth((t - S.apresentacao.start - 2.6) / 0.4));
  aR = lerp(aR, 2.6 + Math.sin(t * 11) * 0.3, hello);
  const bye = smooth((t - L[4].end + 1.4) / 0.4);
  aR = lerp(aR, 2.6 + Math.sin(t * 11) * 0.3, bye);
  fa.arms[0].rotation.z = -aL; fa.arms[1].rotation.z = aR;

  // 1) alta
  const upK = smooth((t - S.alta.start - 0.3) / 1.2) * (1 - smooth((t - S.grafico.start) / 0.5));
  up.visible = upK > 0.01;
  const len = Math.max(0.001, upK * 1.9);
  upShaft.scale.y = len; upShaft.position.y = len / 2; upHead.position.y = len + 0.15;
  lbl323.visible = upK > 0.95; lbl323.scale.set(0.36 * lbl323.userData.aspect * easeBack((t - L[1].start - (L[1].end - L[1].start) * 0.82) / 0.4), 0.36 * easeBack((t - L[1].start - (L[1].end - L[1].start) * 0.82) / 0.4), 1);
  lbl323.visible = lbl323.scale.y > 0.01 && upK > 0.01;
  const pk = easeBack((t - L[1].start - (L[1].end - L[1].start) * 0.7) / 0.4);
  lblPico.visible = pk > 0.01 && upK > 0.01; lblPico.scale.set(0.26 * lblPico.userData.aspect * pk, 0.26 * pk, 1);
  const ck = easeBack((t - L[1].start - (L[1].end - L[1].start) * 0.4) / 0.4);
  lblCres.visible = ck > 0.01 && upK > 0.01; lblCres.scale.set(0.22 * lblCres.userData.aspect * ck, 0.22 * ck, 1);

  // 2) barras
  const gOut = 1 - smooth((t - S.ainda.start) / 0.6);
  const lineK = (t - L[2].start) / (L[2].end - L[2].start);
  bars.forEach((b, i) => {
    const grow = easeOut((t - S.grafico.start - 0.4 - i * 0.5) / 0.9) * gOut;
    const h = Math.max(0.001, b.h * grow);
    b.g.visible = grow > 0.01;
    b.bar.scale.y = h; b.bar.position.y = h / 2;
    b.edge.scale.y = h; b.edge.position.y = h / 2;
    b.vl.position.set(0, h + 0.2, 0.3);
    b.bar.material.emissiveIntensity = 0.45 + (i === 2 ? 0.35 * (0.5 + 0.5 * Math.sin(t * 4)) * smooth((lineK - 0.3) / 0.1) : 0);
  });
  const bk = easeBack((lineK - 0.55) / 0.08) * gOut;
  badge.visible = bk > 0.01; badge.scale.set(0.34 * badge.userData.aspect * bk, 0.34 * bk, 1);
  const lk = easeBack((lineK - 0.8) / 0.08) * gOut;
  lowest.visible = lk > 0.01; lowest.scale.set(0.24 * lowest.userData.aspect * lk, 0.24 * lk, 1);

  // 3) luzes da memória
  const lightK = smooth((t - S.ainda.start - 0.3) / 1.0) * (1 - smooth((t - S.final.start - 1.0) / 1.0));
  lights.forEach(l => {
    const age = (t - S.ainda.start - l.d * 0.6);
    const vis = age > 0 && lightK > 0.01;
    l.m.visible = l.h.visible = vis;
    if (!vis) return;
    const y = 0.15 + ((age * l.sp) % 2.6);
    l.m.position.set(l.x + Math.sin(t + l.ph) * 0.05, y, l.z); l.h.position.copy(l.m.position);
    const fade = lightK * clamp(1 - y / 2.8);
    l.m.scale.setScalar(fade + 0.001); l.h.material.opacity = 0.3 * fade;
  });

  // 4) 190
  const ek = easeBack((t - L[4].start - (L[4].end - L[4].start) * 0.45) / 0.45) * (1 - smooth((t - S.cartao.start) / 0.4));
  lbl190.visible = ek > 0.01; lbl190.scale.set(0.34 * lbl190.userData.aspect * ek, 0.34 * ek, 1);

  overlay(t);
  fonte(t);
  gancho(t);
}

const $ = id => document.getElementById(id);
const L0 = L[0], L0d = L0.end - L0.start;
const wordFrac = w => L0.text.split(' ').findIndex(x => x.startsWith(w)) / L0.text.split(' ').length;
const F_Q = wordFrac('subindo') - 0.08, F_END = wordFrac('Os');
function gancho(t) {
  const lt = t - L0.start;
  $('flash').style.opacity = 0;
  // 323 já completo no 1º quadro (ele vira a capa do vídeo), com batida e pulsação
  $('num').textContent = '323';
  const slam = 1 + 0.35 * (1 - easeOut(t / 0.3)) + 0.04 * Math.max(0, Math.sin(t * 8)) * (1 - smooth((t - 2.6) / 0.8));
  const shake = lt < 1.5 ? Math.sin(t * 70) * 6 * (1 - lt / 1.5) : 0;
  const hookOut = 1 - smooth((t - L0.start - L0d * F_END) / 0.35);
  $('hook').style.opacity = hookOut;
  $('num').style.transform = `translateX(${shake}px) scale(${slam})`;
  $('numcap').style.opacity = 1;
  // pergunta: subindo ou caindo? (setas piscando alternadas)
  const qk = easeBack((t - L0.start - L0d * F_Q) / 0.4);
  $('q').style.opacity = clamp(qk);
  $('q').style.transform = `scale(${Math.max(0.01, qk)})`;
  const blinkUp = Math.sin(t * 9) > 0;
  $('upq').style.transform = `scale(${blinkUp ? 1.12 : 0.92})`;
  $('dnq').style.transform = `scale(${blinkUp ? 0.92 : 1.12})`;
  // vinheta vermelha pulsando no começo
  $('vig').style.opacity = (0.55 + 0.45 * Math.sin(t * 8)) * (1 - smooth((t - 2.6) / 0.8));
  // carimbo do título no fim do gancho
  const st = t - (L0.start + L0d * (F_END + 0.04));
  const stIn = easeBack(st / 0.35, 2.4), stOut = 1 - smooth((t - S.apresentacao.start - 1.6) / 0.4);
  $('title').style.opacity = st > 0 ? clamp(stIn) * stOut : 0;
  $('title').style.transform = `scale(${lerp(2.2, 1, clamp(stIn))}) rotate(${lerp(-8, -2, clamp(stIn))}deg)`;
}

window.renderAt = t => { animate(t); renderer.render(scene, camera); return true; };
window.TOTAL = TL.total;
window.ready = true;
</script>
